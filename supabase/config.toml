# ---------------------------------------------------------------------------
# Auth. Used by `supabase start` locally and `supabase config push`; on the
# hosted project the same values are set in the dashboard (docs/PILOT_RUNBOOK.md).
[auth]
site_url = "https://shastralab-1694.onrender.com"
additional_redirect_urls = ["https://shastralab-1694.onrender.com/**", "http://localhost:8080/**"]
minimum_password_length = 8
password_requirements = "letters_digits"
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "60s"
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your ShastraLab account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your ShastraLab password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your ShastraLab sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new ShastraLab email"
content_path = "./supabase/templates/email_change.html"

# Custom SMTP: without it Supabase only emails members of your Supabase team.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(SMTP_PASSWORD)"
admin_email = "no-reply@mail.shastralab.in"   # placeholder: use your verified sending domain
sender_name = "ShastraLab"

[auth.rate_limit]
email_sent = 60

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
